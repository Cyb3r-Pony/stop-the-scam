    <style>
        /* ==========================================================
           STOP THE SCAM — DESIGN SYSTEM
           Light institutional surfaces for guidance.
           Dark "operational" surfaces for live threat data.

           Semantic colour language (used consistently sitewide):
             red      danger    — losses, blacklisted, malicious, emergency
             orange   alarm     — scam mechanics, warning signs, suspicious
             amber    exposure  — categories of fraud, examples
             emerald  defence   — protection, verified, safe
             blue     knowledge — brand, navigation, learning, registers
             cyan     signal    — live automated detection feed
           ========================================================== */

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #ffffff;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .mono {
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
            font-variant-ligatures: none;
        }

        /* Optical tightening for large display type */
        .display {
            letter-spacing: -0.028em;
        }

        /* ---------- Structural textures (replaces glassmorphism) ---------- */

        .texture-grid {
            background-image:
                linear-gradient(to right, rgba(15, 23, 42, 0.045) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.045) 1px, transparent 1px);
            background-size: 64px 64px;
        }

        .texture-grid-dark {
            background-image:
                linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
            background-size: 64px 64px;
        }

        /* Fades a texture out towards the bottom so it never fights the content */
        .mask-fade-b {
            -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
        }

        .mask-fade-radial {
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 100%);
            mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 100%);
        }

        /* ---------- Scrollbars ---------- */

        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border: 3px solid #f1f5f9;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Inner panels on dark operational surfaces */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Inner panels on light surfaces */
        .light-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .light-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        .light-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ---------- Motion ---------- */

        @keyframes stsFadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim-fade-up {
            animation: stsFadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes stsPulseDot {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.25; }
        }
        .anim-live-dot {
            animation: stsPulseDot 2s ease-in-out infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .anim-fade-up, .anim-live-dot { animation: none; }
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }

        /* ---------- Focus visibility (accessibility) ---------- */

        :focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
            border-radius: 4px;
        }
        .dark-zone :focus-visible {
            outline-color: #60a5fa;
        }
